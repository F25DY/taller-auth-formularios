<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body class="d-flex justify-content-center align-items-center">
    <div class="card register-card shadow-lg">
        <div class="card-header bg-success text-white text-center">
            <h3>Crear cuenta</h3>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/registro}" th:object="${usuario}" method="post">
                <div class="form-floating mb-3">
                    <input type="text" th:field="*{username}" class="form-control" id="username" placeholder="Usuario">
                    <label for="username">Usuario</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" th:field="*{password}" class="form-control" id="password" placeholder="Contraseña">
                    <label for="password">Contraseña</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" th:field="*{rol}" class="form-control" id="rol" placeholder="Rol">
                    <label for="rol">Rol</label>
                </div>
                <button type="submit" class="btn btn-success w-100">Registrarse</button>
            </form>
        </div>
        <div class="card-footer text-center bg-light">
            <small>¿Ya tienes cuenta? <a th:href="@{/login}" class="text-success fw-bold">Inicia sesión</a></small>
        </div>
    </div>
</body>
</html>
