<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1d2b64, #f8cdda);
            height: 100vh;
        }
        .home-card {
            border-radius: 15px;
            overflow: hidden;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center">
    <div class="card home-card shadow-lg" style="width: 32rem;">
        <div class="card-header bg-dark text-white text-center">
            <h3>Panel Principal</h3>
        </div>
        <div class="card-body p-4 text-center">
            <h4 class="text-primary">Bienvenido, <span th:text="${#authentication.name}"></span></h4>
            <p class="lead">Has iniciado sesión correctamente en el sistema.</p>
            <div class="mt-4">
                <a th:href="@{/registro}" class="btn btn-success">Registrar otro usuario</a>
            </div>
        </div>
        <div class="card-footer text-center bg-light">
            <a th:href="@{/logout}" class="btn btn-outline-danger w-100">Cerrar sesión</a>
        </div>
    </div>
</body>
</html>
